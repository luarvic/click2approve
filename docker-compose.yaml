services:
  azurite:
    build: ./azurite
    image: click2approve-azurite:local
    ports:
      - "10000:10000"
      - "10001:10001"
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: P@ssw0rd
    ports:
      - "1433:1433"
  api:
    depends_on:
      - azurite
      - db
    build:
      context: ./api
      dockerfile: Dockerfile.api
    image: click2approve-api:local
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "5555:5555"
    command: /app/wait-for-it.sh -t 60 db:1433 -- dotnet /app/Click2Approve.WebApi.dll
  event-publisher:
    depends_on:
      - azurite
      - db
    build:
      context: ./api
      dockerfile: Dockerfile.event-publisher
    image: click2approve-event-publisher:local
    environment:
      - DOTNET_ENVIRONMENT=Docker
    command: /app/wait-for-it.sh -t 60 db:1433 -- dotnet /app/Click2Approve.EventPublisher.dll
  event-consumer:
    depends_on:
      - azurite
      - db
    build:
      context: ./api
      dockerfile: Dockerfile.event-consumer
    image: click2approve-event-consumer:local
    environment:
      - DOTNET_ENVIRONMENT=Docker
    command: /app/wait-for-it.sh -t 60 db:1433 -- dotnet /app/Click2Approve.EventConsumer.dll
  ui:
    depends_on:
      - api
    build:
      context: ./ui
      args:
        - ENV=development
    image: click2approve-ui:local
    ports:
      - "3333:3333"
