services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      - sh
      - -c
      - >
        azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck &
        azurite-queue --queueHost 0.0.0.0 --skipApiVersionCheck &
        wait
    ports:
      - "10000:10000"
      - "10001:10001"
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: P@ssw0rd
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
  api:
    depends_on:
      azurite:
        condition: service_started
      db:
        condition: service_healthy
    build:
      context: ./api
      dockerfile: Dockerfile.api
    image: click2approve-api:local
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "bash", "/app/check-api-ready.sh"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
  event-publisher:
    depends_on:
      api:
        condition: service_healthy
    build:
      context: ./api
      dockerfile: Dockerfile.event-publisher
    image: click2approve-event-publisher:local
    environment:
      - DOTNET_ENVIRONMENT=Docker
  event-consumer:
    depends_on:
      api:
        condition: service_healthy
    build:
      context: ./api
      dockerfile: Dockerfile.event-consumer
    image: click2approve-event-consumer:local
    environment:
      - DOTNET_ENVIRONMENT=Docker
  ui:
    depends_on:
      api:
        condition: service_healthy
    build:
      context: ./ui
      args:
        - ENV=development
        - DOCS_API_BASE_URI=http://localhost:5555
        - DOCS_SITE_URL=http://localhost:3333/
    image: click2approve-ui:local
    ports:
      - "3333:3333"
