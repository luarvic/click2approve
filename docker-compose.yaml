services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: P@ssw0rd
    ports:
      - "1433:1433"
  api:
    depends_on:
      - azurite
      - db
    build: ./api
    image: click2approve-api:local
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "5555:5555"
    command: /app/wait-for-it.sh -t 60 db:1433 -- dotnet /app/Click2Approve.WebApi.dll
  ui:
    depends_on:
      - api
    build:
      context: ./ui
      args:
        - ENV=development
    image: click2approve-ui:local
    ports:
      - "3333:3333"
