# Only successful fingerprinted app assets may be cached without revalidation.
map "$status:$uri" $static_cache_control {
    default "no-cache";
    ~:/app/version[.]json$ "no-store";
    ~^(200|206|304):/app/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 3333;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve the public scheme and port when HTTPS terminates at the VM proxy.
    absolute_redirect off;

    add_header Cache-Control $static_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    location = /app {
        return 301 /app/$is_args$args;
    }
    location = /docs {
        return 301 /docs/$is_args$args;
    }

    location = /404.html {
        internal;
    }

    location /app/assets/ {
        try_files $uri =404;
    }

    location = /app/version.json {
        try_files $uri =404;
    }

    # Missing static files must not fall back to the React shell.
    location ~ ^/app/.+\.(?:html|css|js|json|svg|png|ico|txt|woff2?)$ {
        try_files $uri =404;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
