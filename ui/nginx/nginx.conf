server {
    listen 3333;
    location = /app {
        return 301 /app/;
    }
    location = /docs {
        return 301 /docs/;
    }
    location /docs/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }
    location /app/ {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /app/index.html;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }
}
