site_name: Click2Approve
site_description: Document workflows, clear decisions, and a shared record of what happens next.
site_url: !ENV [DOCS_SITE_URL, "https://click2approve.com/"]
docs_dir: docs/content
site_dir: site
strict: true

nav:
  - Home: index.md
  - Documentation:
      - Getting started:
          - Table of contents: docs/index.md
          - Getting started: docs/getting-started.md
          - Features and availability: docs/features.md
          - Workspaces and navigation: docs/workspaces.md
      - Requests and tasks:
          - Create a request: docs/create-a-request.md
          - Configure workflow steps: docs/workflow-steps.md
          - Complete a task: docs/complete-a-task.md
          - Track and revise requests: docs/track-requests.md
          - Files and attachments: docs/files.md
          - Discussions: docs/discussions.md
          - Receipts and verification: docs/receipts.md
      - Business workspaces:
          - Manage organizations: docs/organizations.md
          - Employees and roles: docs/employees.md
          - Teams: docs/teams.md
          - Delegations: docs/delegations.md
          - Workflow templates: docs/templates.md
      - Account and security:
          - Registration and sign-in: docs/sign-in.md
          - Profile and signature: docs/profile.md
          - MFA and passkeys: docs/security.md
          - API tokens: docs/api-tokens.md
          - Notifications: docs/notifications.md
      - Plans and data:
          - Plans and billing: docs/plans-and-billing.md
          - Usage and limits: docs/usage.md
          - Retention and deletion: docs/retention.md
      - Help:
          - Troubleshooting: docs/troubleshooting.md
  - Contact: contact.md
  - Terms: terms.md
  - Privacy: privacy.md

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

plugins:
  - search

hooks:
  - docs/hooks.py

extra_css:
  - stylesheets/app.css

extra_javascript:
  - javascripts/app-bar.js

extra:
  homepage: /
  generator: false
