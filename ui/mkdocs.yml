site_name: Click2Approve
site_description: Document workflows, clear decisions, and a shared record of what happens next.
site_url: !ENV [DOCS_SITE_URL, "http://localhost:3333/"]
docs_dir: docs/content
site_dir: site
strict: true
validation:
  links:
    anchors: warn
    absolute_links: ignore

nav:
  - Home: index.md
  - Documentation:
      - Getting started:
          - Table of contents: docs/index.md
          - Getting started: docs/getting-started.md
          - Features and availability: docs/features.md
          - Navigation: docs/workspaces.md
      - Requests and tasks:
          - Create a request: docs/create-a-request.md
          - Configure workflow steps: docs/workflow-steps.md
          - Complete a task: docs/complete-a-task.md
          - Track requests: docs/track-requests.md
          - Files and attachments: docs/files.md
      - Account and security:
          - Registration and sign-in: docs/sign-in.md
          - Profile and signature: docs/profile.md
          - MFA and passkeys: docs/security.md
          - Notifications: docs/notifications.md
      - Help:
          - Troubleshooting: docs/troubleshooting.md
  - Community help: contact.md

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon-192.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

plugins:
  - search

hooks:
  - docs/hooks.py

extra_css:
  - stylesheets/app.css

extra_javascript:
  - javascripts/app-bar.js

extra:
  portal: open-source
  localized: false
  homepage: /
  generator: false
