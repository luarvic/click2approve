name: Build and test

on:
  workflow_call:
    inputs:
      image-tag:
        description: Docker image tag; leave empty to run validation only. A leading v is removed.
        type: string
        default: ""
    secrets:
      DOCKER_HUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build-test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./api
    env:
      C2A_TEST_AZURITE: UseDevelopmentStorage=true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Start Azurite
        # Match local Compose: the SDK uses a newer API version than this emulator.
        run: |
          docker run --detach --name azurite \
            --publish 127.0.0.1:10000:10000 --publish 127.0.0.1:10001:10001 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck
          timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/10000) && (echo > /dev/tcp/127.0.0.1/10001); do sleep 1; done'
      - name: Install dependencies
        run: dotnet restore Click2Approve.Api.sln
      - name: Build
        run: dotnet build Click2Approve.Api.sln --configuration Release --no-restore
      - name: Test (including queue integration)
        run: dotnet test Click2Approve.Api.sln --configuration Release --no-build
      - name: Show Azurite logs on failure
        if: failure()
        run: docker logs azurite
      - name: Stop Azurite
        if: always()
        run: docker rm --force azurite

  build-test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Lint and build
        run: |
          npm run lint
          npm run build

  build-and-push-images:
    needs: [build-test-api, build-test-ui]
    if: github.event_name == 'release' && inputs.image-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./api
            dockerfile: ./api/Dockerfile.api
          - image: ui
            context: ./ui
            dockerfile: ./ui/Dockerfile
    env:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set image tag
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: echo "IMAGE_TAG=${IMAGE_TAG#v}" >> "$GITHUB_ENV"
      - name: Log in to Container registry
        if: env.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: luarvic
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ github.repository }}-${{ matrix.image }}
          tags: type=raw,value=${{ env.IMAGE_TAG }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.DOCKER_HUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
